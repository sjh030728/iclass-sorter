<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .copy ul { list-style: none; padding: 0; margin-top: 4px; }
  .copy li { font-size: 18px; line-height: 1.5; color: #4a5361; padding: 9px 0 9px 30px; position: relative; }
  .copy li::before { content: "✓"; position: absolute; left: 0; color: #2f7be5; font-weight: 700; }
  iframe { display: block; width: 100%; height: 672px; border: 0; }
</style></head>
<body>
  <div class="copy">
    <span class="tag">설정</span>
    <h1>과목 목록은<br>알아서 채워져요</h1>
    <ul>
      <li>과목 페이지에 한 번 들어가면 자동 인식</li>
      <li>학기별 폴더로 나누기</li>
      <li>과목별 폴더 이름 바꾸기</li>
      <li>비교과 강좌도 지원</li>
    </ul>
  </div>
  <div class="win">
    <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="addr">I-class 자동 분류 설정</span></div>
    <iframe id="settings"></iframe>
  </div>
  <script>
    // 실제 extension/options.html을 읽어 common.js 앞에 shim.js(예시 데이터)를 끼워 넣어 보여 줌.
    // file:// 읽기라서 크롬을 --allow-file-access-from-files로 실행해야 함
    const ext = new URL("../../../extension/", location.href).href;
    const xhr = new XMLHttpRequest();
    xhr.open("GET", ext + "options.html", false);
    xhr.send();
    document.getElementById("settings").srcdoc = xhr.responseText
      .replace("<head>", `<head><base href="${ext}">`)
      .replace('<script src="common.js">',
        `<script src="${new URL("shim.js", location.href).href}"><\/script><script src="common.js">`);
  </script>
</body></html>
